name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: smoke test the installed command
        run: |
          lanerun --version
          lanerun --root ${{ runner.temp }} init
          lanerun --root ${{ runner.temp }} add --lane cpu --id smoke --cmd "python -c print(1)"
          lanerun --root ${{ runner.temp }} run --lane cpu --once
          lanerun --root ${{ runner.temp }} status
